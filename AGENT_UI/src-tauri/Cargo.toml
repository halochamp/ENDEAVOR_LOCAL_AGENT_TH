[package]
name = "agent-th-ui"
version = "1.0.0"
description = "Agent TH desktop UI (Tauri 2)"
edition = "2021"

[lib]
name = "agent_th_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "time", "rt"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
